.bn h1{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.sl{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.sl::-webkit-scrollbar{display:none}
.sl .pc{margin-bottom:10px}.sl .pc:last-child{margin-bottom:0}
.r.ac{display:block}.rt{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.rs{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.tri{margin-right:3px;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:7px solid var(--mu);transition:transform .4s cubic-bezier(.32,.72,0,1)}
.r.open .tri{transform:rotate(180deg)}
.nbw{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s cubic-bezier(.32,.72,0,1)}.r.open .nbw{grid-template-rows:1fr}
.nbw>div{overflow:hidden;min-height:0}.nb{padding-top:10px;display:flex;flex-direction:column;align-items:flex-start;gap:8px}.nb em{margin:0}
.sh input[type=date]{-webkit-appearance:none;appearance:none;min-width:0;height:48px;text-align:left}
.ib{width:40px;height:40px;border:0;border-radius:50%;background:var(--gr);color:var(--tx);font-size:20px;cursor:pointer;flex:none}
.sb{width:100%;margin:14px 0;padding:14px 18px;border:0;border-radius:999px;background:var(--card);color:var(--tx);font:inherit}
.cs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cc{background:var(--card);border-radius:24px;padding:16px;min-height:108px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;font-size:32px}
.cc b{font-size:17px;font-weight:800}.cc small,.r small{color:var(--mu);font-size:13px;font-weight:500}
h2{font-size:22px;font-weight:800;margin:24px 0 10px}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pc{background:var(--card);border-radius:20px;padding:12px;display:flex;align-items:center;gap:10px;font-weight:700;cursor:pointer;min-width:0}
.pc span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg{flex:none;width:36px;height:36px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
.r{background:var(--card);border-radius:20px;padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start;cursor:pointer}
.r b{display:block}.r em{display:block;font-style:normal;font-size:14px;color:var(--mu);margin-top:4px}
.st{white-space:nowrap}.st i{font-style:normal;color:var(--sg);font-size:18px}.st i.on{color:var(--st)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.top b{font-size:20px;font-weight:800;text-align:center;flex:1}
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:0;box-shadow:0 6px 18px rgba(238,63,88,.4);cursor:pointer}
.fab::before,.fab::after{content:"";position:absolute;left:50%;top:50%;background:#fff;border-radius:2px;transform:translate(-50%,-50%)}.fab::before{width:24px;height:3px}.fab::after{width:3px;height:24px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:9;opacity:0;pointer-events:none;transition:opacity .35s ease}.ov.in{opacity:1;pointer-events:auto}
.sh{background:var(--card);width:100%;max-width:560px;border-radius:28px 28px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto;transform:translateY(100%);transition:transform .45s cubic-bezier(.32,.72,0,1)}.ov.in .sh{transform:none}
.sh input,.sh textarea{width:100%;padding:13px 14px;border:0;border-radius:16px;background:var(--gr);color:var(--tx);font:inherit;margin:6px 0}
.bt{display:block;border:0;border-radius:999px;padding:14px 18px;background:var(--ac);color:#fff;font:700 16px Manrope,sans-serif;cursor:pointer;width:100%;margin-top:8px}.bt.g{background:var(--pk);color:var(--ac)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{background:var(--pk);color:var(--ac);border-radius:999px;padding:8px 14px;font-weight:700;cursor:pointer}
.sp{font-size:36px;text-align:center;margin:8px 0}.sp i{font-style:normal;color:var(--sg);cursor:pointer;padding:0 3px}.sp i.on{color:var(--st)}
.seg{display:flex;gap:6px;margin-bottom:12px}.seg .chip{flex:1;text-align:center;background:var(--card);color:var(--tx)}.seg .chip.on{background:var(--ac);color:#fff}
.mu{color:var(--mu);font-size:14px}
img.sc{width:100%;border-radius:16px}
#m{animation:fi .4s ease}@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.mb{position:fixed;z-index:10;top:calc(24px + env(safe-area-inset-top,0px));right:max(28px,calc(50% - 252px));background:rgba(255,255,255,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#1c1c1e;display:flex}
.bg{display:flex;flex-direction:column;gap:4px;width:18px;margin:auto}.bg i{display:block;height:2px;border-radius:2px;background:currentColor;transition:transform .4s cubic-bezier(.32,.72,0,1),opacity .25s}
.mb.open .bg i:nth-child(1){transform:translateY(6px) rotate(45deg)}.mb.open .bg i:nth-child(2){opacity:0}.mb.open .bg i:nth-child(3){transform:translateY(-6px) rotate(-45deg)}
#mn{position:fixed;inset:0;z-index:8;pointer-events:none}#mn.open{pointer-events:auto}
.mp{position:absolute;top:calc(72px + env(safe-area-inset-top,0px));right:max(28px,calc(50% - 252px));background:var(--card);border-radius:22px;padding:8px;box-shadow:0 10px 30px rgba(0,0,0,.18);opacity:0;transform:scale(.9) translateY(-8px);transform-origin:top right;transition:opacity .3s ease,transform .4s cubic-bezier(.32,.72,0,1)}
#mn.open .mp{opacity:1;transform:none}
.mi{padding:13px 16px;border-radius:14px;font-weight:700;cursor:pointer;white-space:nowrap}.mi:active{background:var(--gr)}
</style>
</head>
<body>
<div id="m"></div><div id="sh"></div><div id="mn"><div class="mp"><div class="mi" data-a="go" data-v="best">🏆 Лучшее и худшее</div><div class="mi" data-a="go" data-v="all">📋 Все записи</div><div class="mi" data-a="bk">💾 Резервная копия</div></div></div><button class="ib mb" id="mb" data-a="menu" aria-label="Меню"><span class="bg"><i></i><i></i><i></i></span></button>
<script>
const $=s=>document.querySelector(s),KEY='mlf.v1';
let D={places:[]},H=[{s:'home'}],X={},GB='p',BLOB=null;
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.places))D=s}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const fd=d=>new Date(d).toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
const CATS={shop:'Магазины',cafe:'Кафе и рестораны'},GR=['Еда','Десерты','Фрукты'],E={'Еда':'🍲','Десерты':'🍰','Фрукты':'🍎'};
const col=n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;return'hsl('+h+' 62% 55%)'};
const logo=p=>`<span class="lg" style="background:${col(p.name)}">${esc(p.name[0].toUpperCase())}</span>`;
const stars=n=>'<span class="st">'+[1,2,3,4,5].map(i=>`<i class="${i<=n?'on':''}">★</i>`).join('')+'</span>';
const P=id=>D.places.find(p=>p.id===id);
const its=p=>p.items.map(i=>({...i,p}));
const allItems=()=>D.places.flatMap(its);
const recent=()=>allItems().sort((a,b)=>b.ts-a.ts);
const cur=()=>H[H.length-1];
const nav=v=>{H.push(v);render();scrollTo(0,0)};
const row=(i,pl)=>`<div class="r" data-a="edit" data-p="${i.p.id}" data-v="${i.id}"><div><b>${esc(i.name)}</b><small>${pl?esc(i.p.name)+(i.group?' · '+i.group:'')+' · ':''}${fd(i.date)}</small>${i.note?`<em>${esc(i.note)}</em>`:''}</div>${stars(i.stars)}</div>`;
const arow=i=>`<div class="r ac" data-a="${i.note?'tg':'edit'}" data-p="${i.p.id}" data-v="${i.id}"><div class="rt"><div><b>${esc(i.name)}</b><small>${esc(i.p.name)}${i.group?' · '+i.group:''} · ${fd(i.date)}</small></div><div class="rs">${stars(i.stars)}${i.note?'<span class="tri"></span>':''}</div></div>${i.note?`<div class="nbw"><div><div class="nb"><em>${esc(i.note)}</em><span class="chip" data-a="edit" data-p="${i.p.id}" data-v="${i.id}">Изменить</span></div></div></div>`:''}</div>`;
const prow=p=>`<div class="r" data-a="place" data-v="${p.id}" style="align-items:center"><span style="display:flex;gap:10px;align-items:center">${logo(p)}<b>${esc(p.name)}</b></span><small>${CATS[p.cat]} · ${p.items.length}</small></div>`;
let T;const closeMenu=()=>{$('#mn').classList.remove('open');$('#mb').classList.remove('open')};
const sheet=h=>{clearTimeout(T);closeMenu();$('#sh').innerHTML=`<div class="ov"><div class="sh">${h}</div></div>`;requestAnimationFrame(()=>requestAnimationFrame(()=>{const o=$('.ov');if(o)o.classList.add('in')}))};
const closeSh=()=>{const o=$('.ov');if(o)o.classList.remove('in');clearTimeout(T);T=setTimeout(()=>{$('#sh').innerHTML=''},450)};

function render(){
  const v=cur(),m=$('#m');let h='';
  const top=t=>`<div class="top"><button class="ib" data-a="back">‹</button><b>${esc(t)}</b><span class="ib" style="visibility:hidden"></span></div>`;
  const fab=a=>`<button class="fab" data-a="${a}">+</button>`;
  if(v.s==='home'){
    const n=c=>D.places.filter(p=>p.cat===c).length;
    const it=recent().slice(0,30),col2=(c,em,t)=>`<div class="col"><div class="cc" data-a="cat" data-v="${c}">${em}<div><b>${t}</b><br><small>заведений: ${n(c)}</small></div></div><div class="sl" style="max-height:340px">${D.places.filter(p=>p.cat===c).sort((a,b)=>b.ts-a.ts).map(p=>`<div class="pc" data-a="place" data-v="${p.id}">${logo(p)}<span>${esc(p.name)}</span></div>`).join('')}</div></div>`;
    h=`<div class="bn"><h1>Foodie</h1></div>
    <input class="sb" id="q" placeholder="Поиск по блюду или заведению" autocomplete="off">
    <div id="sr" hidden></div><div id="hm"><div class="cs">
    ${col2('shop','🛒','Магазины')}
    ${col2('cafe','🍽️','Кафе и рестораны')}</div>`
    +(D.places.length?`<h2>Последние продукты</h2>${it.length?`<div class="sl" style="max-height:min(60vh,520px)">${it.map(arow).join('')}</div>`:'<p class="mu">Пока нет продуктов</p>'}`:'<p class="mu" style="text-align:center;margin-top:24px">Начните с любой категории и добавьте первое заведение</p>')
    +`</div>`+fab('quick');
  }else if(v.s==='cat'){
    const ps=D.places.filter(p=>p.cat===v.c).sort((a,b)=>b.ts-a.ts);
    h=top(CATS[v.c])+(ps.length?ps.map(prow).join(''):'<p class="mu">Здесь пока пусто — нажмите «+»</p>')+fab('addplace');
  }else if(v.s==='place'){
    const p=P(v.id);
    if(p.cat==='shop')h=top(p.name)+GR.map(g=>`<div class="r" data-a="group" data-v="${g}" style="align-items:center"><b style="font-size:18px">${E[g]} ${g}</b><small>${p.items.filter(i=>i.group===g).length}</small></div>`).join('');
    else h=top(p.name)+(p.items.length?its(p).sort((a,b)=>b.ts-a.ts).map(i=>row(i)).join(''):'<p class="mu">Добавьте первое блюдо кнопкой «+»</p>')+fab('additem');
  }else if(v.s==='group'){
    const p=P(v.id),L=its(p).filter(i=>i.group===v.g).sort((a,b)=>b.ts-a.ts);
    h=top(v.g)+`<p class="mu" style="margin-top:0">${esc(p.name)}</p>`+(L.length?L.map(i=>row(i)).join(''):'<p class="mu">Добавьте первый продукт кнопкой «+»</p>')+fab('additem');
  }else if(v.s==='best'){
    const a=allItems(),B=a.filter(i=>i.stars===5),W=a.filter(i=>i.stars>=1&&i.stars<=2);
    const sec=(t,L,k)=>`<h2>${t}</h2>`+(L.length?L.map(i=>row(i,1)).join('')+`<button class="bt g" data-a="share" data-v="${k}">Поделиться картинкой</button>`:'<p class="mu">Пока пусто</p>');
    h=top('Лучшее и худшее')+sec('🏆 Лучшее (5★)',B,'b')+sec('👎 Худшее (1–2★)',W,'w');
  }else if(v.s==='all'){
    const key={p:i=>i.p.name,s:i=>i.stars?'★ '+i.stars:'без оценки',d:i=>new Date(i.date).toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}[GB],g={};
    recent().forEach(i=>(g[key(i)]=g[key(i)]||[]).push(i));
    const ks=Object.keys(g);if(GB==='p')ks.sort((x,y)=>x.localeCompare(y,'ru'));if(GB==='s')ks.sort().reverse();
    h=top('Все записи')+`<div class="seg">${[['p','Места'],['s','Оценки'],['d','Даты']].map(([k,t])=>`<div class="chip${GB===k?' on':''}" data-a="gb" data-v="${k}">${t}</div>`).join('')}</div>`
    +(ks.map(k=>`<h2 style="font-size:17px;margin:16px 0 8px">${esc(k)}</h2>${g[k].map(i=>row(i,1)).join('')}`).join('')||'<p class="mu">Пока пусто</p>');
  }
  m.innerHTML=h;m.style.animation='none';void m.offsetWidth;m.style.animation='';
  const home=v.s==='home';$('#mb').style.display=home?'':'none';if(!home)closeMenu();
  const q=$('#q');
  if(q)q.oninput=()=>{
    const s=q.value.trim().toLowerCase(),r=$('#sr'),hm=$('#hm');
    if(!s){r.hidden=true;hm.hidden=false;return}
    const ps=D.places.filter(p=>p.name.toLowerCase().includes(s)),is=allItems().filter(i=>(i.name+' '+(i.note||'')).toLowerCase().includes(s));
    hm.hidden=true;r.hidden=false;
    r.innerHTML=(ps.map(prow).join('')+is.map(i=>row(i,1)).join(''))||'<p class="mu">Ничего не найдено</p>';
  };
}

const sp=()=>[1,2,3,4,5].map(n=>`<i class="${n<=X.st?'on':''}" data-a="star" data-v="${n}">★</i>`).join('');
function itemSheet(pid,id){
  const p=P(pid||cur().id),i=id&&p.items.find(x=>x.id===id);
  X={pid:p.id,id:i?i.id:null,g:i?i.group:(cur().g||''),st:i?i.stars:0,del:0};
  sheet(`<h2 style="margin-top:0">${i?'Изменить запись':'Новый продукт'}</h2><div class="mu">${esc(p.name)}${X.g?' · '+X.g:''}</div>
  <input id="in" placeholder="${p.cat==='shop'?'Название продукта':'Название блюда'}" value="${i?esc(i.name):''}">
  <div class="sp" id="sp">${sp()}</div>
  <textarea id="nt" rows="3" placeholder="Заметка: что понравилось или нет">${i?esc(i.note):''}</textarea>
  <input id="dt" type="date" value="${i?i.date:today()}">
  <button class="bt" data-a="saveitem">Сохранить</button>${i?'<button class="bt g" data-a="delitem">Удалить</button>':''}`);
}
function placeSheet(c){
  X={c};
  sheet(`<h2 style="margin-top:0">${c==='shop'?'Новый магазин':'Новое заведение'}</h2><input id="pn" placeholder="Название" autocomplete="off"><div class="chips" id="sg"></div><button class="bt" data-a="saveplace">Добавить</button>`);
  $('#pn').oninput=e=>{const q=e.target.value.trim().toLowerCase();$('#sg').innerHTML=q?D.places.filter(p=>p.cat===c&&p.name.toLowerCase().startsWith(q)).slice(0,6).map(p=>`<span class="chip" data-a="place" data-v="${p.id}">${esc(p.name)}</span>`).join(''):''};
}
const rr=(x,a,b,w,h,r)=>{x.beginPath();x.roundRect?x.roundRect(a,b,w,h,r):x.rect(a,b,w,h)};
const fit=(x,t,w)=>{while(x.measureText(t).width>w&&t.length>1)t=t.slice(0,-2)+'…';return t};
function shareCard(k){
  const a=allItems().filter(i=>k==='b'?i.stars===5:i.stars>=1&&i.stars<=2).sort((p,q)=>k==='b'?q.ts-p.ts:p.stars-q.stars||q.ts-p.ts).slice(0,8);
  const c=document.createElement('canvas');c.width=1080;c.height=1350;const x=c.getContext('2d'),F='Manrope,-apple-system,Arial,sans-serif';
  const g=x.createLinearGradient(0,0,1080,1350);g.addColorStop(0,k==='b'?'#ee3f58':'#5b6b8c');g.addColorStop(1,k==='b'?'#ff9a5b':'#9aa8c7');x.fillStyle=g;x.fillRect(0,0,1080,1350);
  x.fillStyle='#fff';x.font='800 76px '+F;x.fillText(k==='b'?'Моё лучшее 🏆':'Больше не берём 👎',60,150);
  x.font='500 34px '+F;x.fillText('Foodie 🍱',60,205);
  a.forEach((i,n)=>{
    const y=250+n*130;x.fillStyle='#fff';rr(x,40,y,1000,114,32);x.fill();
    x.fillStyle='#1c1c1e';x.font='800 38px '+F;x.fillText(fit(x,i.name,620),76,y+50);
    x.fillStyle='#8a8a8f';x.font='500 28px '+F;x.fillText(fit(x,i.p.name,620),76,y+90);
    x.font='42px '+F;x.fillStyle='#d5d5da';x.fillText('★★★★★',770,y+72);x.fillStyle='#f5a524';x.fillText('★'.repeat(i.stars),770,y+72);
  });
  c.toBlob(b=>{BLOB=b});
  sheet(`<img class="sc" src="${c.toDataURL('image/png')}" alt=""><p class="mu">Нажмите и удерживайте картинку, чтобы сохранить в «Фото»</p><button class="bt" data-a="shr">Поделиться</button><button class="bt g" data-a="close">Закрыть</button>`);
}
async function doShare(){try{const f=new File([BLOB],'moya-lyubimaya-eda.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:'Foodie'})}catch(e){}}

const A={
  back:()=>{if(H.length>1)H.pop();render()},
  tg:t=>t.classList.toggle('open'),
  menu:()=>{const o=$('#mn').classList.toggle('open');$('#mb').classList.toggle('open',o);if(o)closeSh()},
  go:(t,v)=>{closeMenu();closeSh();nav({s:v})},
  cat:(t,v)=>nav({s:'cat',c:v}),
  place:(t,v)=>{closeSh();nav({s:'place',id:v})},
  group:(t,v)=>nav({s:'group',id:cur().id,g:v}),
  addplace:()=>placeSheet(cur().c),
  additem:()=>itemSheet(),
  edit:(t,v)=>itemSheet(t.dataset.p,v),
  quick:()=>sheet(`<h2 style="margin-top:0">Добавить в…</h2><button class="bt" data-a="catadd" data-v="shop">🛒 Магазины</button><button class="bt" data-a="catadd" data-v="cafe">🍽️ Кафе и рестораны</button>`),
  catadd:(t,v)=>{closeSh();nav({s:'cat',c:v});placeSheet(v)},
  star:(t,v)=>{X.st=X.st===+v?0:+v;$('#sp').innerHTML=sp()},
  saveitem:()=>{
    const n=$('#in').value.trim();if(!n){$('#in').focus();return}
    const p=P(X.pid);let i=X.id&&p.items.find(x=>x.id===X.id);
    if(!i){i={id:uid(),group:X.g};p.items.push(i)}
    Object.assign(i,{name:n,stars:X.st,note:$('#nt').value.trim(),date:$('#dt').value||today(),ts:Date.now()});
    p.ts=Date.now();save();closeSh();render();
  },
  delitem:t=>{
    if(!X.del){X.del=1;t.textContent='Точно удалить?';return}
    const p=P(X.pid);p.items=p.items.filter(x=>x.id!==X.id);save();closeSh();render();
  },
  saveplace:()=>{
    const n=$('#pn').value.trim();if(!n)return;
    let p=D.places.find(x=>x.cat===X.c&&x.name.toLowerCase()===n.toLowerCase());
    if(!p){p={id:uid(),cat:X.c,name:n,ts:Date.now(),items:[]};D.places.push(p);save()}
    closeSh();nav({s:'place',id:p.id});
  },
  gb:(t,v)=>{GB=v;render()},
  share:(t,v)=>shareCard(v),
  shr:doShare,
  close:closeSh,
  bk:()=>sheet(`<h2 style="margin-top:0">Резервная копия</h2><p class="mu">Скопируйте текст и сохраните его, например, в заметках. Чтобы восстановить, вставьте текст сюда и нажмите «Восстановить».</p><textarea id="bk" rows="6">${esc(JSON.stringify(D))}</textarea><button class="bt" data-a="copy">Скопировать</button><button class="bt g" data-a="restore">Восстановить из текста</button>`),
  copy:t=>{const a=$('#bk');a.select();a.setSelectionRange(0,1e9);try{document.execCommand('copy');t.textContent='Скопировано ✓'}catch(e){}},
  restore:t=>{
    try{const d=JSON.parse($('#bk').value);if(!Array.isArray(d.places))throw 0;D=d;save();closeSh();H.length=1;render()}
    catch(e){t.textContent='Не получилось: проверьте текст'}
  }
};
document.addEventListener('click',e=>{
  if(e.target.id==='mn'){closeMenu();return}
  if(e.target.classList.contains('ov')){closeSh();return}
  const t=e.target.closest('[data-a]');
  if(t&&A[t.dataset.a])A[t.dataset.a](t,t.dataset.v);
});
render();
</script>
</body>
</html>
